name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    # Uses the runner's own PostgreSQL 16 so we can add pg-safeupdate, which Supabase loads for
    # app requests (it rejects DELETE/UPDATE without WHERE; see DOW-76).
    runs-on: ubuntu-24.04
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      REQUIRE_SAFEUPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16 and pg-safeupdate
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-server-dev-16
          git clone -q --depth 1 --branch 1.7 https://github.com/eradman/pg-safeupdate.git /tmp/pg-safeupdate
          make -C /tmp/pg-safeupdate PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no
          sudo make -C /tmp/pg-safeupdate install PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config with_llvm=no
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -q -c "alter user postgres password 'postgres'"
      - run: ./scripts/test-db.sh
